name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install Cordova
      run: npm install -g cordova
    
    - name: Create Cordova Project
      run: |
        cordova create app com.socmed.downloader SocmedDownloader
        cd app
        cordova platform add android
    
    - name: Copy Web Files
      run: |
        cp index.html app/www/index.html
        cp icon.png app/www/icon.png
        cp manifest.json app/www/manifest.json
        cp service-worker.js app/www/service-worker.js
    
    - name: Build APK
      run: |
        cd app
        cordova build android --release
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: socmed-downloader-apk
        path: app/platforms/android/app/build/outputs/apk/release/*.apk